version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      # Dev tooling (pytest, ruff, mypy, ...) moves fast; batch it into one PR.
      dev-dependencies:
        dependency-type: development
        patterns: ["*"]

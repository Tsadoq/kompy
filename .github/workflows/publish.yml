name: Publish to PyPI

# Releases are driven by release-please (https://github.com/googleapis/release-please) and Conventional Commits:
# on every push to main it opens or updates a "chore(main): release X.Y.Z" pull request that bumps
# `kompy.__version__` and adds the changelog entry, both computed from the commit messages since the last release.
# Merging that pull request creates the vX.Y.Z tag and the GitHub release; this workflow then tests and builds the
# package, uploads it to PyPI and attaches the files to the GitHub release.
# Authentication uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-time setup on pypi.org: project "kompy" -> Publishing -> GitHub, repository Tsadoq/kompy,
# workflow publish.yml, environment pypi.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  release-please:
    name: Release PR & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, releases and the release branch
      pull-requests: write # the release pull request
      issues: write # labels on the release pull request
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests opened with the default token do not trigger CI. An optional fine-grained token
          # (contents + pull requests: read/write on this repository) lets CI run on the release pull request.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build & verify
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false # never restore a cache into a release build
      - run: uv sync --locked --group test
      - name: Verify the package reports the released version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          actual="$(uv run --no-sync python -c 'import kompy; print(kompy.__version__)')"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::kompy.__version__ is '$actual', but release-please released '$VERSION'"
            exit 1
          fi
      - run: uv run --no-sync pytest
      - run: uv build --build-constraint build-constraints.txt # exact build backend
      - run: uvx twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kompy/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Generates and uploads PEP 740 attestations automatically.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true # "Re-run failed jobs" must not fail on files already uploaded

  attach:
    name: Attach files to the GitHub release
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

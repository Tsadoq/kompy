name: Publish to PyPI

# Releases are cut by publishing a GitHub release whose tag is `vX.Y.Z` and matches `kompy.__version__`.
# Authentication uses PyPI Trusted Publishing (OIDC): no API token is stored in the repository.
# One-time setup on pypi.org: project "kompy" -> Publishing -> GitHub, repository Tsadoq/kompy,
# workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.13"
          enable-cache: false # never restore a cache into a release build
      - run: uv sync --locked --group test
      - name: Verify the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv run --no-sync python -c 'import kompy; print(kompy.__version__)')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match kompy.__version__ '$version'"
            exit 1
          fi
      - run: uv run --no-sync pytest
      - run: uv build --build-constraint build-constraints.txt # exact build backend
      - run: uvx twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kompy/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Generates and uploads PEP 740 attestations automatically.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

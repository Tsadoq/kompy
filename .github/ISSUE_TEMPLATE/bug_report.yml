name: Bug report
description: Something in kompy does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        kompy talks to Komoot's **unofficial** API, so many problems are caused by changes on Komoot's side.
        The HTTP status code and the (redacted) response body help a lot.

        **Never paste your e-mail address, password, API token or private tour data.**

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal code to reproduce
      description: The shortest snippet that shows the problem. Load credentials from the environment, do not inline them.
      render: python
      placeholder: |
        from kompy import KomootConnector

        connector = KomootConnector.from_env()
        connector.get_tours(limit=5)
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback, log output and API response
      description: |
        The full traceback, plus any `logging` output (enable it with `logging.basicConfig(level=logging.DEBUG)`,
        or run the CLI with `--debug`). kompy hides share tokens and your email address in its own messages, but
        check the output for personal data (email address, username, tokens, tour names) before pasting it.
        If an API call fails, include the endpoint, status code and response body with personal data removed.
      render: text

  - type: input
    id: kompy-version
    attributes:
      label: kompy version
      description: Output of `python -c "import kompy; print(kompy.__version__)"`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / Windows 11"

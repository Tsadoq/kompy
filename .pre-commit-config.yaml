# Install once with `uv run pre-commit install` (installs the pre-commit and commit-msg hooks);
# run on everything with `uv run pre-commit run --all-files`.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit, pre-merge-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  # ruff runs from the project environment, so pre-commit and CI always use the version locked in uv.lock
  # (which Dependabot keeps up to date) instead of a second pin that would drift.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Same check as CI: commit messages follow Conventional Commits, which release-please needs.
      - id: conventional-commit
        name: conventional commit message
        entry: uv run --no-sync python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

  # Keeps uv.lock in sync with pyproject.toml.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
